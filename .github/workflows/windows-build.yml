name: Windows launcher build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test launcher
        shell: pwsh
        run: ./package-launcher.ps1
      - name: Upload launcher package
        uses: actions/upload-artifact@v4
        with:
          name: aioncl-launcher-${{ github.sha }}
          path: out/AionCL-Launcher-*.zip
