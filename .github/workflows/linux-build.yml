name: Linux launcher preview
on:
  workflow_dispatch:
  push:
    branches: [main, feat/linux-launcher]
    paths: ['src/**', 'linux/**', 'tests/**', 'assets/**', 'config/**', 'LINUX.md', '.github/workflows/linux-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AIONCL_DEB_VERSION: 2.5.42~preview${{ github.run_number }}
      AIONCL_RPM_RELEASE: 0.preview${{ github.run_number }}
      AIONCL_PREVIEW_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aioncl-linux-build -f linux/Dockerfile linux
      - run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e AIONCL_DEB_VERSION="$AIONCL_DEB_VERSION" -e AIONCL_RPM_RELEASE="$AIONCL_RPM_RELEASE" -e AIONCL_PREVIEW_NUMBER="$AIONCL_PREVIEW_NUMBER" -v "$PWD:/src" aioncl-linux-build
      - uses: actions/upload-artifact@v4
        with:
          name: aioncl-launcher-linux-${{ github.sha }}
          path: |
            out/AionCL-Launcher-*-linux-*.tar.gz*
            out/aioncl-launcher_*.deb
            out/aioncl-launcher-*.rpm
            out/linux/linux-preview.png

  publish-preview-release:
    if: github.ref == 'refs/heads/feat/linux-launcher'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aioncl-launcher-linux-${{ github.sha }}
          path: packages
      - name: Publish Linux packages as a GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(packages/*.deb packages/*.rpm packages/*.tar.gz packages/*.sha256)
          test "${#assets[@]}" -ge 4
          tag="aioncl-linux-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "${assets[@]}" \
            --repo AionCL/launcher \
            --title "AionCL Linux 2.5.42 Preview ${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --notes "Linux launcher preview packages built and tested from ${GITHUB_SHA}. Install the .deb or .rpm manually; the launcher continues to manage game-client updates."
